[project]
name = "manners"
version = "0.7.0"
description = "Plain-English runtime behavioral checks, pre-run calibration, and call-ordered behavior logs for Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.15",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.scripts]
manners = "manners.cli:app"

[project.entry-points.pytest11]
manners = "manners.pytest_plugin"

[project.urls]
Homepage = "https://github.com/celtiberi/manners"
Repository = "https://github.com/celtiberi/manners"
Issues = "https://github.com/celtiberi/manners/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manners"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: real model calls using TYPESAFE_API_KEY and DEEPSEEK_API_KEY; opt-in with pytest -m live",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
