[project]
name = "probe"
version = "0.2.1"
description = "AI runtime probes, pre-run check, and call-ordered behavior logs for Python code."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.15",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.scripts]
probe = "probe.cli:app"

[project.urls]
Homepage = "https://github.com/celtiberi/probe"
Repository = "https://github.com/celtiberi/probe"
Issues = "https://github.com/celtiberi/probe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: real model calls using TYPESAFE_API_KEY and DEEPSEEK_API_KEY; opt-in with pytest -m live",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
